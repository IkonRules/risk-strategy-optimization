<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="title description">
  <title id="title">Regional decomposition error by topology</title>
  <desc id="description">Mean total variation distance was 0.006117 for nine bridge cases and 0.797696 for ten double-front cases in the retained historical benchmark.</desc>
  <rect width="960" height="430" rx="20" fill="#f8fafc"/>
  <text x="48" y="55" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#101828">When independent regional decomposition works—and fails</text>
  <text x="48" y="84" font-family="Arial, sans-serif" font-size="15" fill="#475467">Historical exact-reference benchmark · mean total variation distance (0 = identical, 1 = disjoint)</text>

  <line x1="220" y1="120" x2="220" y2="344" stroke="#98a2b3" stroke-width="2"/>
  <line x1="220" y1="344" x2="875" y2="344" stroke="#98a2b3" stroke-width="2"/>
  <g font-family="Arial, sans-serif" font-size="13" fill="#667085">
    <text x="220" y="369" text-anchor="middle">0.0</text>
    <text x="351" y="369" text-anchor="middle">0.2</text>
    <text x="482" y="369" text-anchor="middle">0.4</text>
    <text x="613" y="369" text-anchor="middle">0.6</text>
    <text x="744" y="369" text-anchor="middle">0.8</text>
    <text x="875" y="369" text-anchor="middle">1.0</text>
  </g>
  <g stroke="#e4e7ec" stroke-width="1">
    <line x1="351" y1="120" x2="351" y2="344"/>
    <line x1="482" y1="120" x2="482" y2="344"/>
    <line x1="613" y1="120" x2="613" y2="344"/>
    <line x1="744" y1="120" x2="744" y2="344"/>
    <line x1="875" y1="120" x2="875" y2="344"/>
  </g>

  <text x="194" y="179" text-anchor="end" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#344054">Bridge</text>
  <text x="194" y="202" text-anchor="end" font-family="Arial, sans-serif" font-size="13" fill="#667085">9 cases</text>
  <rect x="220" y="151" width="4" height="58" rx="2" fill="#16a34a"/>
  <circle cx="224" cy="180" r="7" fill="#16a34a"/>
  <text x="241" y="186" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#166534">0.006117</text>

  <text x="194" y="279" text-anchor="end" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#344054">Double front</text>
  <text x="194" y="302" text-anchor="end" font-family="Arial, sans-serif" font-size="13" fill="#667085">10 cases</text>
  <rect x="220" y="251" width="522" height="58" rx="8" fill="#dc2626"/>
  <text x="758" y="287" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#991b1b">0.797696</text>

  <text x="48" y="407" font-family="Arial, sans-serif" font-size="14" fill="#667085">The contrast motivated coupling-aware, exact-first routing rather than a universal regional approximation.</text>
</svg>
