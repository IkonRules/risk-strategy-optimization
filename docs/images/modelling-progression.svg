<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-labelledby="title description">
  <title id="title">Project Risk modelling progression</title>
  <desc id="description">Five modelling stages show how the project moved from macro aggregate forecasts to node predictions, exact joint local distributions, regional composition, and an exact-first target architecture. Each stage records what information it preserved and the limitation that motivated the next stage.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#475467"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#101828" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1200" height="840" rx="24" fill="#f8fafc"/>
  <text x="54" y="55" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#101828">From broad prediction to policy-aware state transitions</text>
  <text x="54" y="86" font-family="Arial, sans-serif" font-size="15" fill="#475467">Each pivot preserved more of the information needed by the next decision stage.</text>

  <text x="64" y="126" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#667085">MODELLING STAGE</text>
  <text x="486" y="126" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#667085">INFORMATION PRESERVED</text>
  <text x="826" y="126" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#667085">VALIDATED LIMIT / CONSEQUENCE</text>

  <g filter="url(#shadow)">
    <rect x="54" y="145" width="380" height="104" rx="15" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <text x="78" y="177" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#312e81">1 · Macro statistics</text>
    <text x="78" y="204" font-family="Arial, sans-serif" font-size="14" fill="#3730a3">Ratios, concentration, topology</text>
    <text x="78" y="226" font-family="Arial, sans-serif" font-size="14" fill="#3730a3">OLS · GLM · GAM</text>
  </g>
  <rect x="474" y="153" width="300" height="88" rx="13" fill="#ffffff" stroke="#d0d5dd"/>
  <text x="496" y="185" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#344054">Broad strategic signal</text>
  <text x="496" y="210" font-family="Arial, sans-serif" font-size="14" fill="#475467">Interpretable force and map effects</text>
  <rect x="814" y="153" width="332" height="88" rx="13" fill="#fff7ed" stroke="#f97316"/>
  <text x="836" y="183" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#9a3412">Lost concrete board identity</text>
  <text x="836" y="208" font-family="Arial, sans-serif" font-size="14" fill="#9a3412">A scalar forecast cannot drive the next turn</text>

  <line x1="244" y1="249" x2="244" y2="276" stroke="#475467" stroke-width="2.5" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="54" y="282" width="380" height="104" rx="15" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
    <text x="78" y="314" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#164e63">2 · Node-level ML</text>
    <text x="78" y="341" font-family="Arial, sans-serif" font-size="14" fill="#155e75">Capture and troop outcomes per node</text>
    <text x="78" y="363" font-family="Arial, sans-serif" font-size="14" fill="#155e75">Random Forest baselines</text>
  </g>
  <rect x="474" y="290" width="300" height="88" rx="13" fill="#ffffff" stroke="#d0d5dd"/>
  <text x="496" y="322" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#344054">Local node identity</text>
  <text x="496" y="347" font-family="Arial, sans-serif" font-size="14" fill="#475467">Graph context attached to each target</text>
  <rect x="814" y="290" width="332" height="88" rx="13" fill="#fff7ed" stroke="#f97316"/>
  <text x="836" y="320" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#9a3412">Lost joint legality and dependence</text>
  <text x="836" y="345" font-family="Arial, sans-serif" font-size="14" fill="#9a3412">Marginals need not form one possible state</text>

  <line x1="244" y1="386" x2="244" y2="413" stroke="#475467" stroke-width="2.5" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="54" y="419" width="380" height="104" rx="15" fill="#ecfdf3" stroke="#16a34a" stroke-width="2"/>
    <text x="78" y="451" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#14532d">3 · Exact local model</text>
    <text x="78" y="478" font-family="Arial, sans-serif" font-size="14" fill="#166534">Markov combat · finite state DAG</text>
    <text x="78" y="500" font-family="Arial, sans-serif" font-size="14" fill="#166534">Policy-aware joint terminal distribution</text>
  </g>
  <rect x="474" y="427" width="300" height="88" rx="13" fill="#ffffff" stroke="#d0d5dd"/>
  <text x="496" y="459" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#344054">Legal sequences and correlations</text>
  <text x="496" y="484" font-family="Arial, sans-serif" font-size="14" fill="#475467">Full local policy and successor support</text>
  <rect x="814" y="427" width="332" height="88" rx="13" fill="#fffbeb" stroke="#d97706"/>
  <text x="836" y="457" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#92400e">Combinatorial frontier</text>
  <text x="836" y="482" font-family="Arial, sans-serif" font-size="14" fill="#92400e">Topology, troops, actions, and policy ties grow</text>

  <line x1="244" y1="523" x2="244" y2="550" stroke="#475467" stroke-width="2.5" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="54" y="556" width="380" height="104" rx="15" fill="#fdf2f8" stroke="#db2777" stroke-width="2"/>
    <text x="78" y="588" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#831843">4 · Regional decomposition</text>
    <text x="78" y="615" font-family="Arial, sans-serif" font-size="14" fill="#9d174d">Exact local regions · candidate ranking</text>
    <text x="78" y="637" font-family="Arial, sans-serif" font-size="14" fill="#9d174d">Exact or sampled composition</text>
  </g>
  <rect x="474" y="564" width="300" height="88" rx="13" fill="#ffffff" stroke="#d0d5dd"/>
  <text x="496" y="596" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#344054">Local exactness at larger scale</text>
  <text x="496" y="621" font-family="Arial, sans-serif" font-size="14" fill="#475467">Efficient under genuine weak coupling</text>
  <rect x="814" y="564" width="332" height="88" rx="13" fill="#fef2f2" stroke="#dc2626"/>
  <text x="836" y="594" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#991b1b">Lost cross-region sequence dependence</text>
  <text x="836" y="619" font-family="Arial, sans-serif" font-size="14" fill="#991b1b">Double-front mean TV = 0.797696</text>

  <line x1="244" y1="660" x2="244" y2="687" stroke="#475467" stroke-width="2.5" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="54" y="693" width="380" height="104" rx="15" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="78" y="725" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#4c1d95">5 · Exact-first target</text>
    <text x="78" y="752" font-family="Arial, sans-serif" font-size="14" fill="#5b21b6">Full exact → coupled exact → regional</text>
    <text x="78" y="774" font-family="Arial, sans-serif" font-size="14" fill="#5b21b6">Bounded joint-state fallback last</text>
  </g>
  <rect x="474" y="701" width="300" height="88" rx="13" fill="#ffffff" stroke="#d0d5dd"/>
  <text x="496" y="733" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#344054">Richest tractable representation</text>
  <text x="496" y="758" font-family="Arial, sans-serif" font-size="14" fill="#475467">Policy-aware joint successor output</text>
  <rect x="814" y="701" width="332" height="88" rx="13" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="836" y="731" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#5b21b6">Validation-supported direction</text>
  <text x="836" y="756" font-family="Arial, sans-serif" font-size="14" fill="#5b21b6">Router and macro-region selector not integrated</text>

  <text x="54" y="823" font-family="Arial, sans-serif" font-size="13" fill="#667085">Historical stages remain useful within their validated scope; arrows show modelling pivots, not deletion of earlier ideas.</text>
</svg>
