[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "risk-strategy-optimization"
version = "0.2.0"
description = "Reusable Project Risk research source and exact stochastic strategy demo"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "networkx",
    "joblib",
]

[project.optional-dependencies]
ml = ["scipy", "scikit-learn"]
simulation = ["Pillow"]
visualization = ["Pillow"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["project_risk*"]
